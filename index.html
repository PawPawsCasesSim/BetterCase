<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Case Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
	<link rel="icon" href="data:,">
</head>
<body>

    <div id="dropTicker">
        <div class="ticker-lbl">LIVE DROP</div>
        <div class="ticker-inner" id="tickerInner"></div>
    </div>

    <!-- Экран авторизации -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo">CS2<span>CASE</span></div>
        <div class="login-sub">REALTIME SIMULATOR</div>

        <!-- Переключатель Вход / Регистрация -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabSignIn">ВХОД</button>
            <button class="auth-tab" id="tabSignUp">РЕГИСТРАЦИЯ</button>
        </div>

        <div class="auth-form">
            <!-- Поле никнейма (показывается только при Регистрации или первом входе Google) -->
            <input type="text" id="loginUsername" class="login-input" placeholder="НИКНЕЙМ" style="display: none;">
            
            <input type="email" id="loginEmail" class="login-input" placeholder="EMAIL">
            <input type="password" id="loginPassword" class="login-input" placeholder="ПАРОЛЬ">
            
            <button id="authSubmitBtn" class="login-btn">ВОЙТИ</button>
        </div>

        <div class="auth-divider">ИЛИ</div>

        <!-- Кнопка входа через Google -->
        <button id="googleAuthBtn" class="google-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            ВОЙТИ ЧЕРЕЗ GOOGLE
        </button>

        <p id="loginError" style="color: var(--red); margin-top: 15px; display: none; font-weight: 600; font-size: 14px;"></p>
    </div>
</div>

    <div id="appContent" style="display:none;">
        <header class="header">
            <div class="logo">Better<span>Cases</span></div>
            <div class="hdr-right">
                <button id="addFundsBtn" class="add1-btn">+ $100</button>
                <div class="balance-wrap">
                    <span class="balance-lbl">БАЛАНС</span>
                    <span class="balance-val" id="userBalance">$0.00</span>
                </div>
                <div class="user-pill" id="userPill">GUEST</div>
            </div>
        </header>

        <nav class="nav">
            <button class="nav-tab active" data-page="casesPage">КЕЙСЫ</button>
            <button class="nav-tab" data-page="inventoryPage">ИНВЕНТАРЬ</button>
            <button class="nav-tab" data-page="upgradePage">АПГРЕЙДЕР</button>
        </nav>

        <main class="main">
            <section id="casesPage" class="page active">
                <h2 class="section-title">ОФИЦИАЛЬНЫЕ <span>КЕЙСЫ</span></h2>
                <div class="cases-grid" id="officialCasesGrid"></div>
                
                <h2 class="section-title">КАСТОРМНЫЕ <span>КЕЙСЫ</span></h2>
                <div class="cases-grid" id="customCasesGrid"></div>
            </section>

            <section id="inventoryPage" class="page">
                <div class="inv-controls">
                    <button class="inv-filter active" data-filter="all">ВСЕ</button>
                    <button class="inv-filter" data-filter="covert">COVERT</button>
                    <div class="inv-stats">Стоимость: <span id="invTotalCost">$0.00</span></div>
                </div>
                <div class="inv-grid" id="inventoryGrid"></div>
            </section>

            <section id="upgradePage" class="page">
                <div class="upgrade-arena">
                    <div class="upgrade-arena-side">
                        <div class="upgrade-arena-label">ВАШ ПРЕДМЕТ</div>
                        <div class="upgrade-slot" id="upgradeSourceSlot">
                            <div class="us-label">ВЫБЕРИТЕ ИЗ ИНВЕНТАРЯ ВНИЗУ</div>
                        </div>
                    </div>
                    <div class="upgrade-mid">
                        <div class="upgrade-chance" id="upgradeChanceVal">0%</div>
                        <button class="upgrade-btn" id="startUpgradeBtn" disabled>UPGRADE</button>
                    </div>
                    <div class="upgrade-arena-side">
                        <div class="upgrade-arena-label">ЖЕЛАЕМЫЙ ПРЕДМЕТ</div>
                        <div class="upgrade-slot" id="upgradeTargetSlot">
                            <div class="us-label">ВЫБЕРИТЕ ИЗ КАТАЛОГА ВНИЗУ</div>
                        </div>
                    </div>
                </div>
                <div class="upg-panel">
                    <input type="text" id="upgSearch" class="upg-search" placeholder="Поиск скина для апгрейда...">
                    <div class="upg-catalog-grid" id="upgradeCatalogGrid" style="margin-top:10px;"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="overlay" id="caseModalOverlay">
        <div class="modal">
            <button class="modal-close" id="closeModalBtn">×</button>
            <div class="modal-hdr">
                <div class="modal-info">
                    <h2 id="modalCaseName">Название Кейса</h2>
                    <p>Цена открытия: <span class="open-cost" id="modalCasePrice">$0.00</span></p>
                </div>
                <button class="btn btn-gold" id="openCaseBtn">ОТКРЫТЬ КЕЙС</button>
            </div>

            <div class="roulette-wrap" id="rouletteWrap">
                <div class="roulette-track-wrap">
                    <div class="roulette-arrow"></div>
                    <div class="roulette-track" id="rouletteTrack"></div>
                </div>
            </div>

            <div class="result-grid" id="resultGrid"></div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
